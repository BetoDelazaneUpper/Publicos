<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google Wallet Example — Beto Delazane</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0a;color:#f4f4f2;font-family:"Helvetica Neue",Arial,sans-serif}
    main{width:min(720px,100%);border:1px solid #292929;padding:30px;background:#111}.eyebrow{font-size:10px;letter-spacing:.13em;color:#8c8c88}
    h1{font-size:clamp(48px,10vw,90px);letter-spacing:-.065em;line-height:.86;margin:18px 0 25px}p{color:#9c9c98;line-height:1.6}
    .flow{margin:28px 0;border-top:1px solid #292929}.flow div{display:grid;grid-template-columns:38px 1fr;gap:16px;padding:15px 0;border-bottom:1px solid #292929}.flow span{color:#777;font-size:11px}
    button,a{min-height:46px;padding:0 15px;border:1px solid #3a3a3a;background:#f4f4f2;color:#111;display:inline-flex;align-items:center;text-decoration:none;font-weight:650;cursor:pointer}
    a{margin-left:8px;background:transparent;color:#f4f4f2}button:disabled{opacity:.45;cursor:not-allowed}#status{margin-top:24px;padding:14px;border:1px solid #292929;color:#9c9c98;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap}
  </style>
</head>
<body>
<main>
  <span class="eyebrow">GOOGLE WALLET / LOCAL EXAMPLE</span>
  <h1>Generic<br />Pass.</h1>
  <p>O browser pede uma Save URL. O backend assina o JWT. A Service Account nunca é enviada ao cliente.</p>

  <div class="flow">
    <div><span>01</span><strong>Browser request</strong></div>
    <div><span>02</span><strong>Server signs JWT / RS256</strong></div>
    <div><span>03</span><strong>Google Wallet save flow</strong></div>
  </div>

  <button id="generate" type="button">Gerar Save URL</button>
  <a id="open" href="#" target="_blank" rel="noreferrer" hidden>Abrir Wallet ↗</a>
  <div id="status">Verificando configuração...</div>
</main>

<script>
  const button = document.getElementById("generate");
  const link = document.getElementById("open");
  const status = document.getElementById("status");

  fetch("/api/health")
    .then(async response => ({ ok: response.ok, body: await response.json() }))
    .then(({ ok, body }) => {
      if (!ok) throw new Error(body.error || "Incomplete configuration");
      status.textContent = "Configuração encontrada. Pronto para gerar o passe.";
    })
    .catch(error => {
      status.textContent = "Configuração incompleta:\n" + error.message;
      button.disabled = true;
    });

  button.addEventListener("click", async () => {
    button.disabled = true;
    link.hidden = true;
    status.textContent = "Gerando JWT no backend...";

    try {
      const response = await fetch("/api/wallet-link", { cache: "no-store" });
      const body = await response.json();
      if (!response.ok) throw new Error(body.details || body.error || "Unknown error");

      link.href = body.saveUrl;
      link.hidden = false;
      status.textContent = "Save URL gerada. Abra o fluxo do Google Wallet.";
    } catch (error) {
      status.textContent = "Erro:\n" + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
