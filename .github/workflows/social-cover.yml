name: Prepare Studio 02 share cover

on:
  push:
    branches: ['release/studio-2']
    paths: ['character.js', 'scripts/render-cover.cjs', '.github/workflows/social-cover.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted release branch
        uses: actions/checkout@v6
      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core
      - name: Render public cover only
        run: |
          node scripts/render-cover.cjs
          rsvg-convert --width=1200 --height=630 --format=png --output=assets/social-cover.png assets/social-cover.svg
          python3 - <<'PY'
          import struct
          from pathlib import Path
          b = Path('assets/social-cover.png').read_bytes()
          assert b[:8] == bytes([137,80,78,71,13,10,26,10])
          assert struct.unpack('>II', b[16:24]) == (1200,630)
          print('Valid PNG cover: 1200 x 630; bytes:', len(b))
          PY
      - name: Commit generated cover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social-cover.svg assets/social-cover.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: render Studio 02 share image'
          git push
